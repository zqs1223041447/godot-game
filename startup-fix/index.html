<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>godot游戏仓</title>
  <style>
    html, body, #canvas { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }
    body { background: #11151b; color: #e9e5dc; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
    #canvas { display: block; }
    #canvas:focus { outline: none; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #11151b; }
    #status[hidden] { display: none; }
    #status-panel { width: min(32rem, 90vw); box-sizing: border-box; padding: 1.5rem; line-height: 1.65; }
    #status-title { margin: 0 0 .75rem; font-size: 1.3rem; }
    #status-notice { white-space: pre-line; overflow-wrap: anywhere; }
    #status-progress { width: 100%; margin: .5rem 0; accent-color: #cead69; }
    #save-warning { font-size: .85rem; color: #b8b5ad; }
    #retry { font: inherit; color: #f3e9cd; background: #34332d; border: 1px solid #a78c59; border-radius: .3rem; padding: .5rem 1rem; cursor: pointer; }
    #retry:focus-visible { outline: 2px solid #f3e9cd; outline-offset: 3px; }
    noscript { position: fixed; inset: 0; z-index: 2; padding: 2rem; background: #11151b; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
</head>
<body>
  <canvas id="canvas" tabindex="0">浏览器不支持游戏画布，请使用支持 WebGL 2 的浏览器。</canvas>
  <noscript>运行游戏需要 JavaScript。当前未启动游戏，也未读取或修改存档。</noscript>
  <main id="status" data-state="loading">
    <section id="status-panel" aria-live="polite" aria-atomic="true">
      <h1 id="status-title">正在准备游戏</h1>
      <p id="status-notice">正在加载启动文件；若长时间停留，请检查网络后刷新。</p>
      <progress id="status-progress" hidden aria-label="游戏加载进度"></progress>
      <button id="retry" type="button" hidden>关闭原标签后重试</button>
      <p id="save-warning">进度保存在当前浏览器。保存后请勿立即刷新或关闭页面，浏览器仍需完成后台保存。隐私模式或清理站点数据可能导致进度丢失。</p>
    </section>
  </main>
  <script src="single_instance_gate.js"></script>
  <script src="index.js"></script>
  <script>
(function () {
  'use strict';
  const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":48911456,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  const threadsEnabled = false;
  const overlay = document.getElementById('status');
  const title = document.getElementById('status-title');
  const notice = document.getElementById('status-notice');
  const progress = document.getElementById('status-progress');
  const retry = document.getElementById('retry');

  function show(state, heading, message) {
    overlay.dataset.state = state;
    overlay.hidden = state === 'running';
    title.textContent = heading;
    notice.textContent = message;
    progress.hidden = state !== 'starting';
    retry.hidden = state !== 'blocked';
    retry.disabled = state !== 'blocked';
  }

  // Display only bounded plain text, never an Error stack or a resource URL.
  // Rejections can cross realms (or be strings), so instanceof Error is insufficient.
  function startupDetail(error) {
    let message;
    try { message = typeof error === 'string' ? error : error && error.message; }
    catch (_) { return ''; }
    if (typeof message !== 'string') return '';
    return message.slice(0, 4096)
      .replace(/[a-z][a-z0-9+.-]*:\/\/[^\s<>"']*|\b(?:data|blob):[^\s<>"']*|\/\/[^\s<>"']*/gi, '[资源地址已隐藏]')
      .replace(/[?#][^\s<>"']*/g, '[参数已隐藏]')
      .replace(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/g, ' ')
      .trim().slice(0, 400);
  }

  const states = {
    checking: ['正在检查存档使用状态', '确认没有其他标签运行游戏后，才会加载存档。'],
    blocked: ['游戏已在另一个标签中运行', '为避免覆盖存档，本页尚未启动游戏。请先在原标签保存，勿立即关闭；关闭原标签后，再点击重试。'],
    unsupported: ['此环境无法安全启动游戏', '需要安全连接（HTTPS 或 localhost）和支持 Web Locks 的浏览器。为保护存档，本页不会启动游戏。'],
    unavailable: ['无法取得存档使用权限', '浏览器拒绝了单实例保护。游戏未启动；请检查浏览器设置，或关闭本页后重试。'],
    starting: ['正在加载游戏', '已取得本页独占使用权限，正在加载游戏资源与存档。'],
    running: ['', ''],
    'failed-held': ['游戏启动失败', '为保护存档，本页仍保留使用权限。请关闭或刷新本页后重试；刷新可能丢失尚未完成后台保存的进度。'],
    exited: ['游戏已停止', '可在另一标签重试；若仍提示占用，请关闭本页。退出状态不代表浏览器存储必然成功。'],
    'lock-lost': ['存档保护异常', '请停止操作并关闭本页，避免其他页面同时修改存档。近期进度可能尚未完成后台保存。'],
  };

  // file:// can load JavaScript yet fail when fetching WASM/PCK. Stop before
  // feature checks, engine construction or acquiring the save lock.
  if (globalThis.location && globalThis.location.protocol === 'file:') {
    show('unsupported', '请通过本地服务器或 HTTPS 打开游戏',
      '本版本请通过本地服务器或 HTTPS 运行。直接以文件方式打开时，部分浏览器会拦截资源或存档访问。请将完整导出目录放在本地静态服务器，通过 http://localhost 的地址打开；或使用维护者提供的 HTTPS 游戏链接。游戏尚未启动，也未取得存档使用权限。');
    return;
  }

  if (!globalThis.GodotSingleInstance || typeof Engine !== 'function') {
    show('unavailable', '启动文件加载失败', '游戏未启动。请检查网络后刷新，或联系维护者检查游戏文件是否完整。');
    return;
  }
  let locks;
  try {
    locks = navigator.locks;
    const missing = Engine.getMissingFeatures({ threads: threadsEnabled });
    if (missing.length) {
      show('unsupported', '浏览器缺少游戏所需功能', '游戏未启动。缺少：' + missing.join('、'));
      return;
    }
  } catch (error) {
    const detail = startupDetail(error);
    if (detail) console.error(detail);
    show('unavailable', '无法检查浏览器环境', '游戏未启动，请检查浏览器设置后重试。');
    return;
  }
  const gate = GodotSingleInstance.createSingleInstanceGate({
    locks,
    secure: globalThis.isSecureContext === true,
    onState(state, detail) {
      const text = states[state];
      const reason = startupDetail(detail);
      show(state, text[0], text[1] + (state === 'failed-held' && reason ? '\n启动错误：' + reason : ''));
      if (reason) console.error(reason);
    },
    async start({ onExit }) {
      // Godot's init wrapper does not forward a rejected cached WASM load.
      // Await the public loader first so download failures reach failed-held.
      // startGame reuses this cached promise; do not fetch or compile twice.
      // All loading, construction and initialization stay behind the save lock.
      await Engine.load(config.executable, config.fileSizes[`${config.executable}.wasm`]);
      const engine = new Engine(config);
      return engine.startGame({
        onExit,
        onProgress(current, total) {
          if (overlay.dataset.state !== 'starting') return;
          if (current > 0 && total > 0) {
            progress.value = current;
            progress.max = total;
          } else {
            progress.removeAttribute('value');
            progress.removeAttribute('max');
          }
        },
      });
    },
  });
  retry.addEventListener('click', () => { gate.requestStart(); });
  gate.requestStart();
}());
  </script>
</body>
</html>
