name: Verify and publish localhost startup bundle
on:
  push:
    branches: [dot/20261020-web-release]
    paths: ['startup-fix/**', '.github/workflows/startup-fix.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: startup-fix-release-20261020
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'zqs1223041447/godot-game' && github.ref == 'refs/heads/dot/20261020-web-release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOARCH: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect hosted runner Go toolchain without downloading
        shell: bash
        run: |
          set -euo pipefail
          command -v go
          go version
          go env GOVERSION GOOS GOARCH GOROOT
      - name: Test startup shell and instance gate
        if: runner.os == 'Linux'
        run: node --test startup-fix/tests/*.test.mjs
      - name: Unit tests and vet on native operating system
        working-directory: startup-fix/launcher
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test -v ./...
          go vet ./...
      - name: Verify original archive and stage diagnostic HTML
        run: python startup-fix/prepare.py stage
      - name: Build native launcher
        working-directory: startup-fix/launcher
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            go build -buildvcs=false -trimpath -o ../../stage/bundle/Start-Game.exe .
          else
            go build -buildvcs=false -trimpath -o ../../stage/bundle/launcher-linux .
          fi
      - name: Native launcher process smoke test without browser
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            python startup-fix/smoke.py stage/bundle/Start-Game.exe
          else
            python startup-fix/smoke.py stage/bundle/launcher-linux
          fi
      - name: Package verified Windows bundle
        if: runner.os == 'Windows'
        run: python startup-fix/package.py stage
      - name: Upload only tested Windows release files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-fix-windows
          path: stage/dist/
          if-no-files-found: error
          retention-days: 7
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: startup-fix-windows
          path: dist
      - name: Verify ZIP and publish new immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          tag=web-playable-20261020-startup-fix
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$tag" --pattern godot-game-web-windows-launcher.zip --dir existing-release
            cmp dist/godot-game-web-windows-launcher.zip existing-release/godot-game-web-windows-launcher.zip
          else
            gh release create "$tag" dist/godot-game-web-windows-launcher.zip dist/SHA256SUMS dist/build-manifest.json \
              --target "$RELEASE_TARGET" --title 'Windows local browser launcher and startup diagnostics' \
              --notes-file startup-fix/RELEASE_NOTES.md
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
